[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgdmc-repro"
version = "0.1.0"
description = "Reproducibility scaffold for KGDMC real-data experiments"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "numpy>=1.24,<3", "pyyaml>=6,<7", "wandb>=0.16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ml = ["torch>=2.2,<3", "transformers>=4.40,<5", "pillow>=10,<12"]

[project.scripts]
kgdmc = "kgdmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

